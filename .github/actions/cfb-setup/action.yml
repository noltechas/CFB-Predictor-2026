name: CFB runner setup
description: >
  Python environment, a working copy at the Mac's absolute path (stored symlinks and
  JSON pointers name /Users/chasnolte/IdeaProjects/CFB-Predictor-2026), the .env the
  shell scripts source, and pipeline state restored from the Actions cache plus
  Supabase Storage (cfbpred.ci_state). A failed restore stops the job: running on
  missing state would publish 2026-only tables over the real ones.
inputs:
  state-sets: {description: "ci/state_sets.json sets to restore", required: true}
  cache-key: {description: "Actions-cache key prefix (one per workflow)", required: true}
  cfbd-api-key: {required: true}
  supabase-url: {required: true}
  supabase-publishable-key: {required: true}
  supabase-db-password: {required: true}
  supabase-db-host: {required: true}
  supabase-db-pooler-host: {required: true}
  supabase-service-role-key: {required: true}
runs:
  using: composite
  steps:
    - name: Free disk space
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        df -h / | tail -1
    - name: zsh (the pipeline scripts are zsh)
      shell: bash
      run: command -v zsh >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq zsh)
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements-ci.txt
    - name: Install packages
      shell: bash
      run: pip install -q -r requirements-ci.txt
    - name: Working copy at the production path, with .env
      shell: bash
      env:
        CFBD_API_KEY: ${{ inputs.cfbd-api-key }}
        SUPABASE_URL: ${{ inputs.supabase-url }}
        SUPABASE_PUBLISHABLE_KEY: ${{ inputs.supabase-publishable-key }}
        SUPABASE_DB_PASSWORD: ${{ inputs.supabase-db-password }}
        SUPABASE_DB_HOST: ${{ inputs.supabase-db-host }}
        SUPABASE_DB_POOLER_HOST: ${{ inputs.supabase-db-pooler-host }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.supabase-service-role-key }}
      run: |
        sudo mkdir -p /Users/chasnolte/IdeaProjects
        sudo chown -R "$USER" /Users/chasnolte
        cp -a "$GITHUB_WORKSPACE" "$CFB_HOME"
        umask 077
        for k in CFBD_API_KEY SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_DB_PASSWORD \
                 SUPABASE_DB_HOST SUPABASE_DB_POOLER_HOST SUPABASE_SERVICE_ROLE_KEY; do
          printf '%s=%s\n' "$k" "${!k}"
        done > "$CFB_HOME/.env"
    - name: Restore state from the Actions cache
      uses: actions/cache/restore@v4
      with:
        path: |
          /Users/chasnolte/IdeaProjects/CFB-Predictor-2026/data
          /Users/chasnolte/IdeaProjects/CFB-Predictor-2026/models
          /Users/chasnolte/IdeaProjects/CFB-Predictor-2026/logs
          /Users/chasnolte/IdeaProjects/CFB-Predictor-2026/.ci_state
        key: ${{ inputs.cache-key }}-${{ github.run_id }}
        restore-keys: ${{ inputs.cache-key }}-
    - name: Bring state up to date from Supabase Storage
      shell: bash
      working-directory: /Users/chasnolte/IdeaProjects/CFB-Predictor-2026
      env:
        SUPABASE_URL: ${{ inputs.supabase-url }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ inputs.supabase-service-role-key }}
      run: PYTHONPATH=src python -m cfbpred.ci_state restore ${{ inputs.state-sets }}
