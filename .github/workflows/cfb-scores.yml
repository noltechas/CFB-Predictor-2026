name: scores
# Every 30 minutes: final scores, lines and rosters in; Results ledger and lines
# republished; public availability reports archived. Replaces launchd com.cfbpred.scores.
on:
  schedule:                  # UTC; GitHub may start a run several minutes late
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: cfb-pipeline
  cancel-in-progress: false
env:
  CFB_HOME: /Users/chasnolte/IdeaProjects/CFB-Predictor-2026
  TZ: America/Chicago          # logs/api_calls.csv stamps are naive Central time, as on the Mac
jobs:
  scores:
    if: github.event_name == 'workflow_dispatch' || vars.CFB_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cfb-setup
        with:
          state-sets: core
          cache-key: cfb-core
          cfbd-api-key: ${{ secrets.CFBD_API_KEY }}
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-db-host: ${{ secrets.SUPABASE_DB_HOST }}
          supabase-db-pooler-host: ${{ secrets.SUPABASE_DB_POOLER_HOST }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Run
        working-directory: ${{ env.CFB_HOME }}
        run: ./refresh_scores.sh
      - uses: ./.github/actions/cfb-finish
        if: always()
        with:
          state-sets: core schedule
          cache-key: cfb-core
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-service-role-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
